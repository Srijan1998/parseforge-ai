services:

  postgres:
    image: postgres:17
    container_name: parseforge-postgres
    environment:
      POSTGRES_DB: parseforge
      POSTGRES_USER: parseforge
      POSTGRES_PASSWORD: parseforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parseforge -d parseforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: parseforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: parseforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: parseforge
      MINIO_ROOT_PASSWORD: parseforge123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: